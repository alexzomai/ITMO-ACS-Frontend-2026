<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вкусная лента: рецепты и кулинарные блоги</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html" data-icon="logo">Вкусная лента</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="search.html">Рецепты</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div class="d-flex gap-2 py-2 py-lg-0">
            <a class="btn btn-outline-primary" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <section class="hero mb-5">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <h1 class="mb-3">Делитесь рецептами и находите новые</h1>
          <p class="lead mb-4">Домашние рецепты с пошаговыми инструкциями, фото и видео от кулинаров, на которых можно подписаться.</p>
          <form class="d-flex flex-column flex-sm-row gap-2" action="search.html" role="search">
            <label for="heroSearch" class="visually-hidden">Поиск рецептов</label>
            <input id="heroSearch" class="form-control form-control-lg" type="search" name="q" placeholder="Например, сырники">
            <button class="btn btn-primary btn-lg" type="submit" data-icon="search"> Найти</button>
          </form>
        </div>
        <div class="col-lg-5">
          <div class="d-flex flex-wrap gap-2" id="dishTypes"></div>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 mb-0">Популярные рецепты</h2>
        <a href="search.html">Все рецепты</a>
      </div>
      <div class="row g-4" id="popularRecipes"></div>
    </section>

    <section class="mb-4">
      <h2 class="h3 mb-3">Кулинары</h2>
      <div class="row g-4" id="authorsList"></div>
    </section>
  </main>

  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>Вкусная лента, 2026</span>
      <span>Учебный проект, ИТМО</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
