<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск рецептов: Вкусная лента</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html" data-icon="logo">Вкусная лента</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="search.html">Рецепты</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div class="d-flex gap-2 py-2 py-lg-0">
            <a class="btn btn-outline-primary" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h2 mb-4">Поиск рецептов</h1>
    <div class="row g-4">
      <aside class="col-lg-3">
        <button class="btn btn-outline-primary w-100 d-lg-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#filtersPanel" aria-expanded="false" aria-controls="filtersPanel">
          Фильтры
        </button>
        <form class="filters collapse d-lg-block" id="filtersPanel">
          <div class="mb-3">
            <label for="query" class="form-label fw-medium">Название</label>
            <input type="search" class="form-control" id="query" name="q" placeholder="Например, суп">
          </div>

          <div class="mb-3">
            <label for="dishType" class="form-label fw-medium">Тип блюда</label>
            <select class="form-select" id="dishType" name="type">
              <option value="">Любой</option>
            </select>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label fw-medium fs-6">Сложность</legend>
            <div id="difficultyList"></div>
          </fieldset>

          <fieldset class="mb-3">
            <legend class="form-label fw-medium fs-6">Ингредиенты</legend>
            <div id="ingredientList"></div>
            <div class="form-text">Показываются рецепты, где есть все отмеченные продукты.</div>
          </fieldset>

          <div class="mb-3">
            <label for="maxTime" class="form-label fw-medium">Время приготовления</label>
            <select class="form-select" id="maxTime" name="time">
              <option value="">Не важно</option>
              <option value="30">До 30 минут</option>
              <option value="60">До часа</option>
              <option value="120">До двух часов</option>
            </select>
          </div>

          <button type="reset" class="btn btn-outline-secondary w-100">Сбросить фильтры</button>
        </form>
      </aside>

      <section class="col-lg-9">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
          <p class="mb-0 text-muted" id="resultsCount"></p>
          <div class="d-flex align-items-center gap-2">
            <label for="sort" class="text-nowrap">Сортировка</label>
            <select class="form-select form-select-sm" id="sort">
              <option value="popular">Популярные</option>
              <option value="fast">Быстрые</option>
              <option value="title">По алфавиту</option>
            </select>
          </div>
        </div>
        <div class="row g-4" id="results"></div>
      </section>
    </div>
  </main>

  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>Вкусная лента, 2026</span>
      <span>Учебный проект, ИТМО</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
